<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#FDE8D0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4703A"/>
      <stop offset="100%" stop-color="#E8945A"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="40" fill="url(#bg)"/>
  <!-- Scissors -->
  <g transform="translate(250,160) rotate(-30)" opacity="0.15">
    <circle cx="-20" cy="0" r="35" stroke="#C4703A" stroke-width="4" fill="none"/>
    <circle cx="20" cy="0" r="35" stroke="#C4703A" stroke-width="4" fill="none"/>
    <rect x="-2" y="-50" width="4" height="50" rx="2" fill="#C4703A"/>
    <rect x="-2" y="0" width="4" height="50" rx="2" fill="#C4703A"/>
  </g>
  <!-- Paw prints -->
  <g opacity="0.12" fill="#C4703A">
    <circle cx="120" cy="380" r="18"/><circle cx="105" cy="360" r="8"/><circle cx="135" cy="360" r="8"/><circle cx="100" cy="385" r="7"/><circle cx="140" cy="385" r="7"/>
    <circle cx="380" cy="120" r="14"/><circle cx="368" cy="105" r="6"/><circle cx="392" cy="105" r="6"/><circle cx="365" cy="123" r="5.5"/><circle cx="395" cy="123" r="5.5"/>
    <circle cx="400" cy="420" r="12"/><circle cx="390" cy="408" r="5"/><circle cx="410" cy="408" r="5"/><circle cx="388" cy="422" r="4.5"/><circle cx="412" cy="422" r="4.5"/>
  </g>
  <!-- Person silhouette -->
  <g transform="translate(180,180)">
    <circle cx="70" cy="30" r="45" fill="url(#accent)" opacity="0.9"/>
    <path d="M30,80 Q70,65 110,80 Q120,120 115,200 Q70,215 25,200 Q20,120 30,80Z" fill="url(#accent)" opacity="0.85"/>
    <!-- Arms -->
    <path d="M110,110 Q140,130 160,110" stroke="#C4703A" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M30,110 Q10,130 20,150" stroke="#C4703A" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
  <!-- Dog silhouette (Pomeranian) -->
  <g transform="translate(270,250)">
    <ellipse cx="80" cy="90" rx="65" ry="55" fill="#D4956A" opacity="0.8"/>
    <circle cx="100" cy="40" r="35" fill="#D4956A" opacity="0.85"/>
    <circle cx="88" cy="35" r="5" fill="#3D2B1F" opacity="0.7"/>
    <circle cx="108" cy="33" r="5" fill="#3D2B1F" opacity="0.7"/>
    <ellipse cx="98" cy="45" rx="4" ry="3" fill="#3D2B1F" opacity="0.6"/>
    <!-- Ears -->
    <path d="M75,15 Q70,-5 82,8" fill="#C4703A" opacity="0.8"/>
    <path d="M115,12 Q125,-5 118,10" fill="#C4703A" opacity="0.8"/>
    <!-- Fluffy tail -->
    <path d="M20,70 Q-10,40 0,20 Q15,35 25,60" fill="#E8B88A" opacity="0.7"/>
  </g>
  <!-- Text -->
  <text x="250" y="460" text-anchor="middle" font-family="Tahoma, Arial" font-size="22" font-weight="bold" fill="#8B5E3C" opacity="0.6">صالح گرومر 🐾</text>
</svg>
